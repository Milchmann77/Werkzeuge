<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werkzeuge</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa8b8;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1b3a5c 0%, var(--bg) 50%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      width: 100%;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid #2b3a4d;
      border-radius: 1rem;
      padding: 2rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Werkzeuge</h1>
    <p>
      Sammlung kleiner HTML-Werkzeuge.
    </p>
    <p style="margin-top:1.1rem">
      <a href="https://milchmann77.github.io/Werkzeuge/HTML/Dienstplankonverter.html">Dienstplankonverter öffnen</a>
    </p>
    <footer>
      <a href="https://github.com/Milchmann77/Werkzeuge">Repository auf GitHub</a>
    </footer>
  </main>
</body>
</html>
